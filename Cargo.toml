[package]
name = "deskmates-rs"
version = "0.1.0"
edition = "2021"
description = "Safe, offline, cross-platform reimplementation of the late-90s Oska DeskMates (Tahni first). Zero adware, zero phone-home, fully unlocked."
license = "MIT"

[dependencies]
winit = "0.30"
pixels = "0.17"
# GL backend keeps wgpu working on ancient/virtualized drivers (and lavapipe-free
# software rendering); feature-unified into pixels' wgpu.
ab_glyph = "0.2"
wgpu = { version = "29", default-features = false, features = ["gles"] }
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
parking_lot = "0.12"
libc = "0.2"
tray-icon = "0.19"

[target.'cfg(target_os = "linux")'.dependencies]
# libappindicator tray support pumps the default GMainContext.
gtk = "0.18"

[profile.release]
opt-level = 2
