[package]
name = "deskmates-rs"
version = "0.1.0"
edition = "2021"
description = "Safe, offline, cross-platform reimplementation of the late-90s Oska DeskMates (Tahni first). Zero adware, zero phone-home, fully unlocked."
license = "MIT"

[dependencies]
winit = "0.30"
pixels = "0.17"
# GL backend keeps wgpu working on ancient/virtualized drivers (and lavapipe-free
# software rendering); feature-unified into pixels' wgpu.
ab_glyph = "0.2"
wgpu = { version = "29", default-features = false, features = ["gles"] }
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
parking_lot = "0.12"
flate2 = "1"
libc = "0.2"
tray-icon = "0.19"
# Optional agent chat ("Ask Tahni…"). Only ever contacted when the user
# configures an endpoint (Settings dialog / config file); the pet itself
# never touches the network otherwise. rustls keeps it pure-Rust + https.
# Disable (`--no-default-features`) for cross-checks: ring cannot build for
# windows-msvc/apple targets from a Linux GNU host.
ureq = { version = "2", default-features = false, features = ["json", "rustls"], optional = true }
rodio = { version = "0.22.2", default-features = false, features = ["playback", "wav"] }

[features]
default = ["agent"]
agent = ["dep:ureq"]

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
flate2 = "1"

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
# libappindicator tray support pumps the default GMainContext.
gtk = "0.18"
# XShape window clipping (transparency without a compositor).
x11rb = { version = "0.13", features = ["shape", "screensaver"] }

[profile.release]
opt-level = 2
